# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: mevn_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      matrix:
        node-version: [25.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - uses: pnpm/action-setup@v6
    - run: cp .env.example .env
    - run: pnpm install --frozen-lockfile
    - run: pnpm run --if-present build
    - run: pnpm run typecheck
    - run: pnpm test
      env:
        MEVN_TEST_MYSQL_HOST: 127.0.0.1
        MEVN_TEST_MYSQL_PORT: 3306
        MEVN_TEST_MYSQL_USER: root
        MEVN_TEST_MYSQL_PASSWORD: test_password
        MEVN_TEST_MYSQL_DATABASE: mevn_test
